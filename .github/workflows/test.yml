# Verificare rapida pe fiecare push/PR: typecheck + lint + suita de teste
# (vitest). Bug de proces gasit la audit — niciun workflow existent nu rula
# de fapt `vitest`; android-debug-build.yml doar compileaza (tsc), iar
# deploy.yml doar buildeaza pentru GitHub Pages. Pana acum, singura plasa de
# siguranta reala era rularea manuala locala inainte de fiecare PR. Acest
# workflow ruleaza independent de partea nativa Android (nu are nevoie de
# modelele ML/Gradle), deci ramane rapid si nu necesita acces la
# dl.google.com (indisponibil in sandbox-ul de dezvoltare).
name: Test

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Plasa de siguranta gasita lipsa dupa un bug real: `npm test` a ramas
    # agatat (bucla infinita, nu doar o asteptare blocata — vezi fix-ul din
    # exportPhotos.ts) pe FIECARE push, ore in sir, pana a umplut limita de
    # execuții paralele a contului si a blocat orice alt build (inclusiv
    # cel de APK, cerut direct). Fara acest plafon, un asemenea bug tot
    # blocheaza coada 6h (limita implicita GitHub) inainte sa pice singur.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
