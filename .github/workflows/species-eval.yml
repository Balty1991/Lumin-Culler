# Pragul căutării după specie (scripts/species-eval). Nu atinge aplicația.
name: Evaluare specii
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/species-eval/**'
      - '.github/workflows/species-eval.yml'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --quiet "transformers>=4.50" pillow numpy
      - run: python scripts/species-eval/eval.py
