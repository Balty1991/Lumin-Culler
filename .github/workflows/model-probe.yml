# Verificare temporară a modelului de adâncime (Depth Anything V2 Small,
# Apache-2.0): prototipul neclarității în profunzime și al Foto 3D pe o poză
# publică, cu imaginile în jurnal. Se șterge după.
name: Model probe

on:
  push:
    branches:
      - 'ccr-**'
    paths:
      - '.github/workflows/model-probe.yml'
      - '.github/probe/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q onnxruntime pillow numpy opencv-python-headless ai-edge-litert
      - name: Download
        run: |
          mkdir m && cd m
          curl -sSfL -o model_quantized.onnx https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx
          sha256sum model_quantized.onnx
          curl -sSfL -o selfie_segmenter.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite
          curl -sSfL -o portrait.jpg https://storage.googleapis.com/mediapipe-assets/portrait.jpg
      - run: python .github/probe/lens.py
