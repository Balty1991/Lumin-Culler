# Build de test (.apk NESEMNAT, doar debug) — verifica DOAR ca partea nativa
# Android (Gradle/Kotlin) compileaza, fara sa ceara secretele de semnare din
# release-android.yml. Util mai ales cand se schimba ceva pe partea nativa
# (android/) — sandbox-ul de dezvoltare nu poate ajunge la dl.google.com
# (Maven-ul Google), deci build-ul real Gradle nu poate fi verificat local
# acolo; acest workflow e prima verificare reala, automata.
name: Build debug Android APK

on:
  workflow_dispatch:
    inputs:
      dev_mode:
        description: >-
          Pastreaza butoanele/hook-urile de test din meniu (ex. [DEV] Test
          detectie nativa) — doar pentru testare manuala pe device, NU pentru
          build-uri normale de CI. Ramane oricum un build NORMAL de productie
          (minificat, React fara StrictMode dublu) — bug real gasit la
          testare: legarea acestui buton de `vite build --mode development`
          punea toata aplicatia in modul development al React, unde
          StrictMode dubleaza deliberat efectele (pornea analiza la import
          de doua ori, bloca vizibil telefonul). Acum foloseste doar
          variabila VITE_NATIVE_TEST_BUTTON (vezi src/ui/MenuDrawer.tsx),
          fara sa atinga modul de build.
        type: boolean
        default: false
      minify:
        description: >-
          Trece APK-ul de test prin R8, cu EXACT regulile de la release
          (proguard-rules.pro). Implicit oprit. Porneste-l cand vrei sa
          verifici pe telefon ca minificarea nu rupe nimic INAINTE sa iasa un
          release — assembleDebug normal nu trece prin R8, deci altfel
          rupturile de reflexie (Capacitor isi gaseste plugin-urile pe nume)
          s-ar vedea abia in magazin. De incercat cu el pornit: pornirea
          aplicatiei, un import cu analiza, bokeh-ul, si exportul.
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android-debug-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Fara modele Human.js, CLIP, orase sau .task/.tflite. Cleaner-ul nu le
      # citeste, iar Vite copiaza public/ in APK. Ochiul de best-shot e in AAR-ul
      # ML Kit, nu intr-un asset descarcat aici.
      - name: Build web
        # dev_mode (doar la declansare manuala) seteaza VITE_NATIVE_TEST_BUTTON=true,
        # NU modul de build — ramane un build NORMAL de productie (`vite build`,
        # fara --mode development) in ambele cazuri, ca sa nu puna React in
        # StrictMode dublu (bug real gasit la testare: dubla pornirea analizei
        # la import, bloca vizibil telefonul). Push-urile automate raman
        # neschimbate (variabila goala = butonul de test ramane ascuns).
        run: |
          npx tsc
          if [ "${{ github.event.inputs.dev_mode }}" = "true" ]; then
            echo "Build productie + buton de test nativ pastrat"
            VITE_NATIVE_TEST_BUTTON=true npx vite build
          else
            npx vite build
          fi
      - run: npx cap sync android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK (nesemnat)
        working-directory: android
        run: ./gradlew assembleDebug -PminifyDebug=${{ inputs.minify == true }}
      # Cand R8 pica pe clase lipsa, scrie EXACT regulile care i-ar trebui in
      # missing_rules.txt. Fara pasul asta ele raman pe runner si dispar odata
      # cu el, iar reparatia devine ghicit din log — s-a intamplat exact asa
      # prima data. Se incarca doar la esec, deci nu ingreuneaza nimic in rest.
      # Cat a APUCAT R8 sa optimizeze, ca sa nu ghicim.
      #
      # Cerinta Play cere minimum 25% acoperire de optimizare, micsorare si
      # ofuscare. Regulile din proguard-rules.pro pastreaza insa blocuri intregi
      # (`-keep class com.google.mlkit.** { *; }` si celelalte), tocmai ca sa nu
      # se rupa reflexia — iar acele biblioteci sunt majoritatea codului. Exista
      # deci un risc REAL ca regulile care fac buildul sa mearga sa submineze
      # chiar pragul pentru care am pornit R8.
      #
      # mapping.txt listeaza fiecare clasa redenumita; numarul de linii spune cat
      # s-a ofuscat de fapt. Se incarca doar la build-urile minificate — la
      # celelalte fisierul nici nu exista.
      - name: Cat a optimizat R8
        if: ${{ inputs.minify == true }}
        uses: actions/upload-artifact@v4
        with:
          name: r8-raport
          path: |
            android/app/build/outputs/mapping/**/mapping.txt
            android/app/build/outputs/mapping/**/configuration.txt
            android/app/build/outputs/mapping/**/usage.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Regulile pe care le cere R8 (doar la esec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: |
            android/app/build/outputs/mapping/**/missing_rules.txt
            android/app/build/outputs/mapping/**/configuration.txt
          if-no-files-found: ignore
          retention-days: 1
      # Marimea se raporteaza IN rezumatul rularii, nu doar in fisier: altfel
      # singurul mod de a afla cat s-a mai umflat APK-ul era sa-l descarci —
      # exact lucrul care doare pe o legatura mobila. Cu asta se vede din
      # browser, inainte de descarcare.
      - name: Raporteaza marimea APK-ului
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "### APK de test: $(numfmt --to=iec --format='%.1f' "$bytes")" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cele mai mari componente:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$apk" | sort -k1 -n -r | head -12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
