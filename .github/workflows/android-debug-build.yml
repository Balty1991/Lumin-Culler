# Build de test (.apk NESEMNAT, doar debug) — verifica DOAR ca partea nativa
# Android (Gradle/Kotlin) compileaza, fara sa ceara secretele de semnare din
# release-android.yml. Util mai ales cand se schimba ceva pe partea nativa
# (android/) — sandbox-ul de dezvoltare nu poate ajunge la dl.google.com
# (Maven-ul Google), deci build-ul real Gradle nu poate fi verificat local
# acolo; acest workflow e prima verificare reala, automata.
name: Build debug Android APK

on:
  workflow_dispatch:
    inputs:
      dev_mode:
        description: >-
          Build cu import.meta.env.DEV=true (pastreaza butoanele/hook-urile
          de test din meniu, ex. [DEV] Test detectie nativa) — doar pentru
          testare manuala pe device, NU pentru build-uri normale de CI.
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android-debug-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # acelasi pas ca in deploy.yml/release-android.yml — modelele AI trebuie
      # incluse in pachetul nativ, nu doar in PWA
      - name: Bundle ML models
        run: |
          mkdir -p public/models
          for m in blazeface facemesh iris emotion faceres centernet; do
            cp node_modules/@vladmandic/human/models/$m.json public/models/
            cp node_modules/@vladmandic/human/models/$m.bin public/models/
          done
      - name: Build web
        # dev_mode (doar la declansare manuala) pastreaza import.meta.env.DEV=true
        # in output-ul static (spre deosebire de `vite dev`, tot un build static,
        # sigur de impachetat in APK) — normal, push-urile automate raman pe
        # build-ul de productie neschimbat (dev_mode gol/false pentru event push).
        run: |
          npx tsc
          if [ "${{ github.event.inputs.dev_mode }}" = "true" ]; then
            echo "Build DEV (butoane de test pastrate)"
            npx vite build --mode development
          else
            npx vite build
          fi
      - run: npx cap sync android
      # Analiza AI nativa (Faza 3 — vezi plugins/ObjectDetectionPlugin.kt): model
      # TFLite COCO SSD MobileNet oficial (Apache 2.0, download.tensorflow.org),
      # NU committed in git (~4MB binar) — descarcat aici, la fel ca modelele
      # Human.js de mai sus, doar ca in assets-urile native Android, nu in public/.
      - name: Bundle native object-detection model
        run: |
          curl -sL -o /tmp/coco_ssd.zip https://storage.googleapis.com/download.tensorflow.org/models/tflite/coco_ssd_mobilenet_v1_1.0_quant_2018_06_29.zip
          mkdir -p android/app/src/main/assets
          unzip -o /tmp/coco_ssd.zip -d android/app/src/main/assets
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK (nesemnat)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
