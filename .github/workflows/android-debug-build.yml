# Build de test (.apk NESEMNAT, doar debug) — verifica DOAR ca partea nativa
# Android (Gradle/Kotlin) compileaza, fara sa ceara secretele de semnare din
# release-android.yml. Util mai ales cand se schimba ceva pe partea nativa
# (android/) — sandbox-ul de dezvoltare nu poate ajunge la dl.google.com
# (Maven-ul Google), deci build-ul real Gradle nu poate fi verificat local
# acolo; acest workflow e prima verificare reala, automata.
name: Build debug Android APK

on:
  workflow_dispatch:
    inputs:
      dev_mode:
        description: >-
          Pastreaza butoanele/hook-urile de test din meniu (ex. [DEV] Test
          detectie nativa) — doar pentru testare manuala pe device, NU pentru
          build-uri normale de CI. Ramane oricum un build NORMAL de productie
          (minificat, React fara StrictMode dublu) — bug real gasit la
          testare: legarea acestui buton de `vite build --mode development`
          punea toata aplicatia in modul development al React, unde
          StrictMode dubleaza deliberat efectele (pornea analiza la import
          de doua ori, bloca vizibil telefonul). Acum foloseste doar
          variabila VITE_NATIVE_TEST_BUTTON (vezi src/ui/MenuDrawer.tsx),
          fara sa atinga modul de build.
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/android-debug-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # acelasi pas ca in deploy.yml/release-android.yml — modelele AI trebuie
      # incluse in pachetul nativ, nu doar in PWA
      - name: Bundle ML models
        run: |
          mkdir -p public/models
          for m in blazeface facemesh iris emotion faceres centernet; do
            cp node_modules/@vladmandic/human/models/$m.json public/models/
            cp node_modules/@vladmandic/human/models/$m.bin public/models/
          done
      # "Locatii" — numele localitatilor, ca ecranul sa scrie "Rosiori de Vede,
      # Romania" in loc de "44.114, 24.987", FARA sa intrebe vreun serviciu
      # (cerinta directa a utilizatorului: "sa nu plece nimic deloc"). Lista
      # vine de la GeoNames (CC BY 4.0, atribuire in politica de
      # confidentialitate) si e adusa aici, la build, exact ca modelele AI —
      # nu se comite in git, si nu se descarca niciodata de pe telefon.
      # Lista e MONDIALA (toate tarile), nu doar Romania. cities500 = tot ce
      # trece de ~500 de locuitori, plus resedintele — de trei ori mai multe
      # localitati mici decat cities1000, cerinta utilizatorului.
      # Pastram doar 5 coloane din formatul GeoNames: nume, latitudine,
      # longitudine, cod de tara, populatie. Populatia da raza sub care o poza
      # e considerata IN localitate (un catun nu se intinde cat un oras).
      # Vezi core/placeNames.ts pentru citire; fara fisierul asta, aplicatia
      # merge mai departe fara nume de localitati.
      - name: Bundle place names
        run: |
          mkdir -p public/places
          curl -fL -o /tmp/cities500.zip https://download.geonames.org/export/dump/cities500.zip
          unzip -p /tmp/cities500.zip cities500.txt \
            | awk -F'\t' 'NF>=15 && $2 != "" && $5 != "" && $6 != "" { printf "%s\t%.4f\t%.4f\t%s\t%s\n", $2, $5, $6, $9, $15 }' \
            > public/places/cities.tsv
          lines=$(wc -l < public/places/cities.tsv)
          echo "cities.tsv: $lines localitati, $(stat -c%s public/places/cities.tsv) octeti"
          # `curl -f` prinde un 404, dar nu si o arhiva valida cu alt continut;
          # pragul de mai jos prinde o lista trunchiata inainte sa ajunga intr-un
          # pachet "verde" in care numele de localitati lipsesc in tacere.
          if [ "$lines" -lt 150000 ]; then echo "::error::lista de localitati pare trunchiata ($lines randuri)" && exit 1; fi
      - name: Build web
        # dev_mode (doar la declansare manuala) seteaza VITE_NATIVE_TEST_BUTTON=true,
        # NU modul de build — ramane un build NORMAL de productie (`vite build`,
        # fara --mode development) in ambele cazuri, ca sa nu puna React in
        # StrictMode dublu (bug real gasit la testare: dubla pornirea analizei
        # la import, bloca vizibil telefonul). Push-urile automate raman
        # neschimbate (variabila goala = butonul de test ramane ascuns).
        run: |
          npx tsc
          if [ "${{ github.event.inputs.dev_mode }}" = "true" ]; then
            echo "Build productie + buton de test nativ pastrat"
            VITE_NATIVE_TEST_BUTTON=true npx vite build
          else
            npx vite build
          fi
      - run: npx cap sync android
      # Analiza AI nativa (Faza 3, rescrisa — vezi plugins/ImageLabelingPlugin.kt):
      # modelul TFLite COCO SSD MobileNet descarcat separat aici a fost inlocuit
      # cu ML Kit Image Labeling, bundle-uit direct in dependinta Gradle — niciun
      # pas de descarcare CI separat nu mai e necesar pentru acest modul.
      # Analiza AI nativa (Faza 4 — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt):
      # doua modele MediaPipe oficiale (Google AI Edge, CC-BY-4.0/Apache 2.0),
      # NU committed in git — descarcate direct (nu arhive, spre deosebire de
      # modelul COCO de mai sus).
      # Bug real gasit de auditul QA: `curl -sL` fara `-f` intoarce exit code 0
      # chiar si pe un raspuns HTTP de eroare (404/5xx) — corpul acelui raspuns
      # (de obicei o pagina HTML de eroare) se scria totusi in fisierul .task/
      # .tflite, iar buildul Gradle care urmeaza nu are niciun motiv sa esueze
      # (nu valideaza continutul modelelor). Rezultatul: un AAB/APK "verde" in
      # CI care contine un model corupt — orice poza cu fata detectata pica
      # silentios la analiza (vezi FaceMeshPlugin.kt, apelat necondtionat
      # pentru fiecare fata din nativeAnalysis.ts). `-f` face curl sa esueze
      # zgomotos pe orice status HTTP de eroare; verificarea marimii minime
      # prinde in plus un fisier trunchiat/gol care ar fi trecut de `-f`.
      - name: Bundle native face-mesh model
        run: |
          curl -fL -o android/app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          for f in face_landmarker.task; do
            size=$(stat -c%s "android/app/src/main/assets/$f")
            if [ "$size" -lt 100000 ]; then echo "::error::$f are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
          done
      # Analiza AI nativa (Faza 5 — vezi plugins/PoseDetectionPlugin.kt): modelul
      # MediaPipe pose lite, NU committed in git. TextRecognitionPlugin.kt nu are
      # nevoie de pas separat — modelul lui e bundle-uit direct in dependinta ML Kit.
      #
      # Modelul de segmentare (selfie_multiclass, 15,6 MB) a fost scos odata cu
      # SegmentationPlugin.kt: nu era folosit de analiza reala, doar de butonul
      # de test DEV. Vezi si efficientnet_lite0 (17,7 MB) la pasul de mai sus.
      - name: Bundle native pose model
        run: |
          curl -fL -o android/app/src/main/assets/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          for f in pose_landmarker_lite.task; do
            size=$(stat -c%s "android/app/src/main/assets/$f")
            if [ "$size" -lt 100000 ]; then echo "::error::$f are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
          done
      # Analiza AI nativa (Faza 6 — vezi plugins/ImageEmbedderPlugin.kt): embedding
      # general de similaritate vizuala (MediaPipe, MobileNetV3-small), NU committed in git.
      - name: Bundle native image-embedder model
        run: |
          curl -fL -o android/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          size=$(stat -c%s android/app/src/main/assets/mobilenet_v3_small.tflite)
          if [ "$size" -lt 100000 ]; then echo "::error::mobilenet_v3_small.tflite are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK (nesemnat)
        working-directory: android
        run: ./gradlew assembleDebug
      # Marimea se raporteaza IN rezumatul rularii, nu doar in fisier: altfel
      # singurul mod de a afla cat s-a mai umflat APK-ul era sa-l descarci —
      # exact lucrul care doare pe o legatura mobila. Cu asta se vede din
      # browser, inainte de descarcare.
      - name: Raporteaza marimea APK-ului
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "### APK de test: $(numfmt --to=iec --format='%.1f' "$bytes")" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cele mai mari componente:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$apk" | sort -k1 -n -r | head -12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
