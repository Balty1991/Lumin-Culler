# Build + semnare automata a pachetului Android (.aab) pentru Play Store.
# Separat de deploy.yml (care publica PWA-ul pe GitHub Pages la fiecare push pe
# main) — acesta ruleaza doar la cerere sau la un tag de versiune, ca sa nu
# consume minute CI la fiecare commit obisnuit.
#
# Cerinte (Settings -> Secrets and variables -> Actions, din acest repo):
#   ANDROID_KEYSTORE_BASE64   continutul fisierului .jks, codificat base64
#                             (ex: base64 -w0 lumin-culler-release.jks)
#   ANDROID_KEYSTORE_PASSWORD parola keystore-ului
#   ANDROID_KEY_ALIAS         alias-ul cheii (vezi android/app/keystore.properties.example)
#   ANDROID_KEY_PASSWORD      parola cheii
#
# Fara aceste secrete configurate, job-ul esueaza explicit la pasul de decodare
# (mai bine decat un build "reusit" dar nesemnat, care ar fi respins de Play Console).
name: Build signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from CI run
        run: |
          # Bug real gasit de auditul QA: versionCode era hardcodat la 1 in build.gradle,
          # potrivit doar pentru PRIMUL upload — Play Console respinge orice upload
          # ulterior cu acelasi versionCode (trebuie strict crescator). run_number creste
          # monoton la fiecare rulare a ACESTUI workflow, indiferent de trigger (tag sau
          # manual), deci e o sursa simpla si sigura, fara sa depinda de formatul tag-ului.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.$VERSION_CODE"
          fi
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Setat versionCode=$VERSION_CODE versionName=$VERSION_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # acelasi pas ca in deploy.yml — modelele AI trebuie incluse in pachetul nativ, nu doar in PWA
      - name: Bundle ML models
        run: |
          mkdir -p public/models
          for m in blazeface facemesh iris emotion faceres centernet; do
            cp node_modules/@vladmandic/human/models/$m.json public/models/
            cp node_modules/@vladmandic/human/models/$m.bin public/models/
          done
      # "Locatii" — numele localitatilor, ca ecranul sa scrie "Rosiori de Vede,
      # Romania" in loc de "44.114, 24.987", FARA sa intrebe vreun serviciu
      # (cerinta directa a utilizatorului: "sa nu plece nimic deloc"). Lista
      # vine de la GeoNames (CC BY 4.0, atribuire in politica de
      # confidentialitate) si e adusa aici, la build, exact ca modelele AI —
      # nu se comite in git, si nu se descarca niciodata de pe telefon.
      # Lista e MONDIALA (toate tarile), nu doar Romania. cities500 = tot ce
      # trece de ~500 de locuitori, plus resedintele — de trei ori mai multe
      # localitati mici decat cities1000, cerinta utilizatorului.
      # Pastram doar 5 coloane din formatul GeoNames: nume, latitudine,
      # longitudine, cod de tara, populatie. Populatia da raza sub care o poza
      # e considerata IN localitate (un catun nu se intinde cat un oras).
      # Vezi core/placeNames.ts pentru citire; fara fisierul asta, aplicatia
      # merge mai departe fara nume de localitati.
      - name: Bundle place names
        run: |
          mkdir -p public/places
          curl -fL -o /tmp/cities500.zip https://download.geonames.org/export/dump/cities500.zip
          unzip -p /tmp/cities500.zip cities500.txt \
            | awk -F'\t' 'NF>=15 && $2 != "" && $5 != "" && $6 != "" { printf "%s\t%.4f\t%.4f\t%s\t%s\n", $2, $5, $6, $9, $15 }' \
            > public/places/cities.tsv
          lines=$(wc -l < public/places/cities.tsv)
          echo "cities.tsv: $lines localitati, $(stat -c%s public/places/cities.tsv) octeti"
          # `curl -f` prinde un 404, dar nu si o arhiva valida cu alt continut;
          # pragul de mai jos prinde o lista trunchiata inainte sa ajunga intr-un
          # pachet "verde" in care numele de localitati lipsesc in tacere.
          if [ "$lines" -lt 150000 ]; then echo "::error::lista de localitati pare trunchiata ($lines randuri)" && exit 1; fi
      - run: npm run build
      - run: npx cap sync android
      # Analiza AI nativa (Faza 3, rescrisa — vezi plugins/ImageLabelingPlugin.kt):
      # modelul TFLite COCO SSD MobileNet descarcat separat aici a fost inlocuit
      # cu ML Kit Image Labeling, bundle-uit direct in dependinta Gradle — niciun
      # pas de descarcare CI separat nu mai e necesar pentru acest modul.
      # Analiza AI nativa (Faza 4 — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt):
      # doua modele MediaPipe oficiale (Google AI Edge, CC-BY-4.0/Apache 2.0),
      # NU committed in git — descarcate direct (nu arhive, spre deosebire de
      # modelul COCO de mai sus).
      # Bug real gasit de auditul QA: `curl -sL` fara `-f` intoarce exit code 0
      # chiar si pe un raspuns HTTP de eroare (404/5xx) — corpul acelui raspuns
      # (de obicei o pagina HTML de eroare) se scria totusi in fisierul .task/
      # .tflite, iar buildul Gradle care urmeaza nu are niciun motiv sa esueze
      # (nu valideaza continutul modelelor). Rezultatul: un AAB semnat, "verde"
      # in CI, care contine un model corupt — orice poza cu fata detectata pica
      # silentios la analiza (vezi FaceMeshPlugin.kt, apelat necondtionat
      # pentru fiecare fata din nativeAnalysis.ts). `-f` face curl sa esueze
      # zgomotos pe orice status HTTP de eroare; verificarea marimii minime
      # prinde in plus un fisier trunchiat/gol care ar fi trecut de `-f`.
      - name: Bundle native face-mesh and image-classifier models
        run: |
          curl -fL -o android/app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          curl -fL -o android/app/src/main/assets/efficientnet_lite0.tflite https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite
          for f in face_landmarker.task efficientnet_lite0.tflite; do
            size=$(stat -c%s "android/app/src/main/assets/$f")
            if [ "$size" -lt 100000 ]; then echo "::error::$f are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
          done
      # Analiza AI nativa (Faza 5 — vezi plugins/PoseDetectionPlugin.kt / SegmentationPlugin.kt):
      # doua modele MediaPipe oficiale in plus (pose lite + segmentare selfie
      # multiclasa), NU committed in git. TextRecognitionPlugin.kt nu are nevoie
      # de pas separat — modelul lui e bundle-uit direct in dependinta ML Kit.
      - name: Bundle native pose and segmentation models
        run: |
          curl -fL -o android/app/src/main/assets/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          curl -fL -o android/app/src/main/assets/selfie_multiclass.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          for f in pose_landmarker_lite.task selfie_multiclass.tflite; do
            size=$(stat -c%s "android/app/src/main/assets/$f")
            if [ "$size" -lt 100000 ]; then echo "::error::$f are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
          done
      # Analiza AI nativa (Faza 6 — vezi plugins/ImageEmbedderPlugin.kt): embedding
      # general de similaritate vizuala (MediaPipe, MobileNetV3-small), NU committed in git.
      - name: Bundle native image-embedder model
        run: |
          curl -fL -o android/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          size=$(stat -c%s android/app/src/main/assets/mobilenet_v3_small.tflite)
          if [ "$size" -lt 100000 ]; then echo "::error::mobilenet_v3_small.tflite are doar $size octeti — descarcare esuata/trunchiata" && exit 1; fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decode keystore
        run: |
          # Bug real gasit de auditul QA: doar ANDROID_KEYSTORE_BASE64 era
          # verificat aici, desi comentariul de sus (si intentia originala)
          # promitea esec explicit pentru "aceste secrete" (plural, toate 4).
          # Fara acest bloc, un secret lipsa dintre celelalte 3 (de ex.
          # ANDROID_KEY_ALIAS uitat) ajungea sa scrie keystore.properties cu
          # o valoare goala si esua abia mult mai tarziu, in interiorul
          # ./gradlew bundleRelease, cu o eroare Gradle/Java confuza ("Keystore
          # was tampered with, or password was incorrect") fara nicio legatura
          # vizibila cu secretul lipsa real.
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secrete:$missing — vezi comentariul din acest workflow." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
      - name: Write keystore.properties
        run: |
          cat > android/app/keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Clean up keystore
        if: always()
        run: rm -f android/release.jks android/app/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
