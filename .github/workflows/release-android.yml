# Build + semnare automata a pachetului Android (.aab) pentru Play Store.
# Separat de deploy.yml (care publica PWA-ul pe GitHub Pages la fiecare push pe
# main) — acesta ruleaza doar la cerere sau la un tag de versiune, ca sa nu
# consume minute CI la fiecare commit obisnuit.
#
# Cerinte (Settings -> Secrets and variables -> Actions, din acest repo):
#   ANDROID_KEYSTORE_BASE64   continutul fisierului .jks, codificat base64
#                             (ex: base64 -w0 lumin-culler-release.jks)
#   ANDROID_KEYSTORE_PASSWORD parola keystore-ului
#   ANDROID_KEY_ALIAS         alias-ul cheii (vezi android/app/keystore.properties.example)
#   ANDROID_KEY_PASSWORD      parola cheii
#
# Fara aceste secrete configurate, job-ul esueaza explicit la pasul de decodare
# (mai bine decat un build "reusit" dar nesemnat, care ar fi respins de Play Console).
name: Build signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from CI run
        run: |
          # Bug real gasit de auditul QA: versionCode era hardcodat la 1 in build.gradle,
          # potrivit doar pentru PRIMUL upload — Play Console respinge orice upload
          # ulterior cu acelasi versionCode (trebuie strict crescator). run_number creste
          # monoton la fiecare rulare a ACESTUI workflow, indiferent de trigger (tag sau
          # manual), deci e o sursa simpla si sigura, fara sa depinda de formatul tag-ului.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            # Rularea manuala punea "0.0.0-dev.<numar>". Numele asta NU ramane in
            # CI: e ce scrie in Play Console si ce citeste testerul la "Versiune"
            # in fisa aplicatiei. O aplicatie care cere bani pe abonament si se
            # prezinta ca "0.0.0-dev.34" isi taie singura credibilitatea, iar
            # build-urile manuale sunt exact cele trimise testerilor.
            #
            # Sursa adevarului e package.json, tinut in pas cu build.gradle.
            # Citit cu sed, nu cu node: pasul asta ruleaza inaintea lui
            # setup-node. Ce distinge doua build-uri ramane versionCode, care
            # creste oricum la fiecare rulare.
            VERSION_NAME="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)"
          fi
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Setat versionCode=$VERSION_CODE versionName=$VERSION_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci, nu npm install: instaleaza EXACT ce scrie in package-lock.json.
      # `install` are voie sa rezolve altfel decat lockfile-ul, deci un release
      # putea fi construit peste alt arbore de dependinte decat cel testat.
      - run: npm ci --no-audit --no-fund
      # Porti BLOCANTE inainte de orice pas de impachetare. Pana acum, singura
      # plasa era test.yml, care ruleaza la push pe main si pe claude/** — dar
      # workflow-ul asta poate porni manual sau pe un tag, deci un AAB semnat
      # putea fi produs si peste o suita rosie. Semnalat la auditul extern, si e
      # corect: nu conteaza cat de improbabil e, un artefact de release n-are voie
      # sa existe fara verificarile care il fac de incredere.
      - name: Verificare tipuri
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Teste
        run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decode keystore
        run: |
          # Bug real gasit de auditul QA: doar ANDROID_KEYSTORE_BASE64 era
          # verificat aici, desi comentariul de sus (si intentia originala)
          # promitea esec explicit pentru "aceste secrete" (plural, toate 4).
          # Fara acest bloc, un secret lipsa dintre celelalte 3 (de ex.
          # ANDROID_KEY_ALIAS uitat) ajungea sa scrie keystore.properties cu
          # o valoare goala si esua abia mult mai tarziu, in interiorul
          # ./gradlew bundleRelease, cu o eroare Gradle/Java confuza ("Keystore
          # was tampered with, or password was incorrect") fara nicio legatura
          # vizibila cu secretul lipsa real.
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secrete:$missing — vezi comentariul din acest workflow." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
      - name: Write keystore.properties
        run: |
          cat > android/app/keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Clean up keystore
        if: always()
        run: rm -f android/release.jks android/app/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
      # Cat a optimizat R8 — DE AICI, nu din build-ul de debug.
      #
      # Pragul Play din februarie 2027 cere 25% optimizare DEX, si singurul
      # build care spune adevarul despre el e acesta: build-ul de test e
      # `debuggable`, iar acolo R8 sare peste pasii de optimizare, deci
      # raportul lui ar arata mereu mai putin decat livram de fapt.
      #
      # mapping.txt = ce s-a redenumit, usage.txt = ce s-a sters,
      # configuration.txt = toate regulile puse cap la cap, inclusiv cele
      # venite din bibliotecile ML Kit/MediaPipe/billing. Ultimul e cel care
      # arata daca `-keep`-urile noastre din proguard-rules.pro sunt de fapt
      # redundante.
      - name: Cat a optimizat R8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-raport
          path: |
            android/app/build/outputs/mapping/**/mapping.txt
            android/app/build/outputs/mapping/**/configuration.txt
            android/app/build/outputs/mapping/**/usage.txt
          if-no-files-found: warn
          retention-days: 1
