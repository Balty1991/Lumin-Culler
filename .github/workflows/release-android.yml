# Build + semnare automata a pachetului Android (.aab) pentru Play Store.
# Separat de deploy.yml (care publica PWA-ul pe GitHub Pages la fiecare push pe
# main) — acesta ruleaza doar la cerere sau la un tag de versiune, ca sa nu
# consume minute CI la fiecare commit obisnuit.
#
# Cerinte (Settings -> Secrets and variables -> Actions, din acest repo):
#   ANDROID_KEYSTORE_BASE64   continutul fisierului .jks, codificat base64
#                             (ex: base64 -w0 lumin-culler-release.jks)
#   ANDROID_KEYSTORE_PASSWORD parola keystore-ului
#   ANDROID_KEY_ALIAS         alias-ul cheii (vezi android/app/keystore.properties.example)
#   ANDROID_KEY_PASSWORD      parola cheii
#
# Fara aceste secrete configurate, job-ul esueaza explicit la pasul de decodare
# (mai bine decat un build "reusit" dar nesemnat, care ar fi respins de Play Console).
name: Build signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from CI run
        run: |
          # Bug real gasit de auditul QA: versionCode era hardcodat la 1 in build.gradle,
          # potrivit doar pentru PRIMUL upload — Play Console respinge orice upload
          # ulterior cu acelasi versionCode (trebuie strict crescator). run_number creste
          # monoton la fiecare rulare a ACESTUI workflow, indiferent de trigger (tag sau
          # manual), deci e o sursa simpla si sigura, fara sa depinda de formatul tag-ului.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.$VERSION_CODE"
          fi
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Setat versionCode=$VERSION_CODE versionName=$VERSION_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # acelasi pas ca in deploy.yml — modelele AI trebuie incluse in pachetul nativ, nu doar in PWA
      - name: Bundle ML models
        run: |
          mkdir -p public/models
          for m in blazeface facemesh iris emotion faceres centernet; do
            cp node_modules/@vladmandic/human/models/$m.json public/models/
            cp node_modules/@vladmandic/human/models/$m.bin public/models/
          done
      - run: npm run build
      - run: npx cap sync android
      # Analiza AI nativa (Faza 3 — vezi plugins/ObjectDetectionPlugin.kt): model
      # TFLite COCO SSD MobileNet oficial (Apache 2.0, download.tensorflow.org),
      # NU committed in git (~4MB binar) — descarcat aici, la fel ca modelele
      # Human.js de mai sus, doar ca in assets-urile native Android, nu in public/.
      - name: Bundle native object-detection model
        run: |
          curl -sL -o /tmp/coco_ssd.zip https://storage.googleapis.com/download.tensorflow.org/models/tflite/coco_ssd_mobilenet_v1_1.0_quant_2018_06_29.zip
          mkdir -p android/app/src/main/assets
          unzip -o /tmp/coco_ssd.zip -d android/app/src/main/assets
      # Analiza AI nativa (Faza 4 — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt):
      # doua modele MediaPipe oficiale (Google AI Edge, CC-BY-4.0/Apache 2.0),
      # NU committed in git — descarcate direct (nu arhive, spre deosebire de
      # modelul COCO de mai sus).
      - name: Bundle native face-mesh and image-classifier models
        run: |
          curl -sL -o android/app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          curl -sL -o android/app/src/main/assets/efficientnet_lite0.tflite https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite
      # Analiza AI nativa (Faza 5 — vezi plugins/PoseDetectionPlugin.kt / SegmentationPlugin.kt):
      # doua modele MediaPipe oficiale in plus (pose lite + segmentare selfie
      # multiclasa), NU committed in git. TextRecognitionPlugin.kt nu are nevoie
      # de pas separat — modelul lui e bundle-uit direct in dependinta ML Kit.
      - name: Bundle native pose and segmentation models
        run: |
          curl -sL -o android/app/src/main/assets/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          curl -sL -o android/app/src/main/assets/selfie_multiclass.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
      # Analiza AI nativa (Faza 6 — vezi plugins/ImageEmbedderPlugin.kt): embedding
      # general de similaritate vizuala (MediaPipe, MobileNetV3-small), NU committed in git.
      - name: Bundle native image-embedder model
        run: |
          curl -sL -o android/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decode keystore
        run: |
          # Bug real gasit de auditul QA: doar ANDROID_KEYSTORE_BASE64 era
          # verificat aici, desi comentariul de sus (si intentia originala)
          # promitea esec explicit pentru "aceste secrete" (plural, toate 4).
          # Fara acest bloc, un secret lipsa dintre celelalte 3 (de ex.
          # ANDROID_KEY_ALIAS uitat) ajungea sa scrie keystore.properties cu
          # o valoare goala si esua abia mult mai tarziu, in interiorul
          # ./gradlew bundleRelease, cu o eroare Gradle/Java confuza ("Keystore
          # was tampered with, or password was incorrect") fara nicio legatura
          # vizibila cu secretul lipsa real.
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secrete:$missing — vezi comentariul din acest workflow." >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
      - name: Write keystore.properties
        run: |
          cat > android/app/keystore.properties <<PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Clean up keystore
        if: always()
        run: rm -f android/release.jks android/app/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-culler-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
