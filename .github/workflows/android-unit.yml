# Compiles the native cleaner and runs its JVM unit tests.
# Does not build the web bundle or the ML model assets: those are needed for
# an APK, not for :app:testDebugUnitTest. assembleDebug stays on
# android-debug-build.yml (manual / claude/**), which also downloads models.
name: Android unit tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-unit.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-unit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Cordova plugin stub
        run: bash android/scripts/ensure-cordova-stub.sh
      - name: Android SDK 36
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager="$(command -v sdkmanager)"
          fi
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$manager" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$sdk" > android/local.properties
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
