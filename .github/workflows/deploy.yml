# Build + deploy automat la GitHub Pages.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Copiaza modelele ML din pachet in build — nu trebuie sa urci .bin-uri in repo.
      # centernet = detectie de obiecte generale (COCO-80: caine, masina, tort, barca...),
      # folosita pentru etichete automate/export XMP — acelasi pachet Human, niciun model extern nou.
      - name: Bundle ML models
        run: |
          mkdir -p public/models
          for m in blazeface facemesh iris emotion faceres centernet; do
            cp node_modules/@vladmandic/human/models/$m.json public/models/
            cp node_modules/@vladmandic/human/models/$m.bin public/models/
          done
      # CLIP — intelegerea semantica a continutului (core/clip/). OPTIONALA in
      # doua feluri, si amandoua conteaza:
      #
      #  1. Pentru BUILD: daca modelul nu se poate descarca, scriptul nu scrie
      #     manifestul si iese cu 0. Aplicatia construita e atunci exact cea de
      #     azi, fara functie. O functie in plus n-are voie sa opreasca livrarea
      #     a tot restul.
      #  2. Pentru UTILIZATOR: nici runtime-ul, nici modelul nu se descarca pe
      #     telefon pana cand nu cere el functia. Vezi state/clipOptIn.ts.
      #
      # DOAR AICI, nu si in workflow-ul de Android: pe web fisierele se aduc la
      # cerere, dar Capacitor impacheteaza tot ce e in public/ direct in APK —
      # deci acolo cei ~40 MB i-ar plati la instalare inclusiv cine nu foloseste
      # niciodata functia. Se muta si acolo cand masuratorile de pe telefon
      # justifica marimea.
      - name: Bundle CLIP model (optional)
        run: node scripts/fetch-clip-model.mjs
      - name: Bundle ONNX Runtime wasm
        run: |
          if [ -f public/models/clip/manifest.json ]; then
            mkdir -p public/ort
            cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.wasm public/ort/
            cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.mjs public/ort/
            echo "ort: $(du -sh public/ort | cut -f1)"
          else
            echo "Fara model CLIP — nu are rost sa livram runtime-ul singur."
          fi
      # Verificare EXPLICITA, nu dedusa. Pasii de mai sus reusesc si cand nu
      # descarca nimic (asa sunt proiectati: o functie optionala n-are voie sa
      # opreasca livrarea). Consecinta e ca "pas verde" NU inseamna "model
      # livrat" — exact deducerea gresita facuta o data in aceasta sesiune.
      # Randul asta spune ce s-a livrat de fapt, ca sa nu mai fie nevoie de
      # ghicit din marimea artefactului.
      - name: Ce s-a livrat pentru CLIP
        run: |
          if [ -f public/models/clip/manifest.json ]; then
            echo "== CLIP PREZENT =="
            cat public/models/clip/manifest.json
            du -sh public/models/clip public/ort
          else
            echo "== CLIP ABSENT in acest build =="
            echo "Aplicatia livrata e cea de azi, fara functia optionala."
          fi
      # "Locatii" — numele localitatilor, ca ecranul sa scrie "Rosiori de Vede,
      # Romania" in loc de "44.114, 24.987", FARA sa intrebe vreun serviciu
      # (cerinta directa a utilizatorului: "sa nu plece nimic deloc"). Lista
      # vine de la GeoNames (CC BY 4.0, atribuire in politica de
      # confidentialitate) si e adusa aici, la build, exact ca modelele AI —
      # nu se comite in git, si nu se descarca niciodata de pe telefon.
      # Lista e MONDIALA (toate tarile), nu doar Romania. cities500 = tot ce
      # trece de ~500 de locuitori, plus resedintele — de trei ori mai multe
      # localitati mici decat cities1000, cerinta utilizatorului.
      # Pastram doar 5 coloane din formatul GeoNames: nume, latitudine,
      # longitudine, cod de tara, populatie. Populatia da raza sub care o poza
      # e considerata IN localitate (un catun nu se intinde cat un oras).
      # Vezi core/placeNames.ts pentru citire; fara fisierul asta, aplicatia
      # merge mai departe fara nume de localitati.
      - name: Bundle place names
        run: |
          mkdir -p public/places
          curl -fL -o /tmp/cities500.zip https://download.geonames.org/export/dump/cities500.zip
          unzip -p /tmp/cities500.zip cities500.txt \
            | awk -F'\t' 'NF>=15 && $2 != "" && $5 != "" && $6 != "" { printf "%s\t%.4f\t%.4f\t%s\t%s\n", $2, $5, $6, $9, $15 }' \
            > public/places/cities.tsv
          lines=$(wc -l < public/places/cities.tsv)
          echo "cities.tsv: $lines localitati, $(stat -c%s public/places/cities.tsv) octeti"
          # `curl -f` prinde un 404, dar nu si o arhiva valida cu alt continut;
          # pragul de mai jos prinde o lista trunchiata inainte sa ajunga intr-un
          # pachet "verde" in care numele de localitati lipsesc in tacere.
          if [ "$lines" -lt 150000 ]; then echo "::error::lista de localitati pare trunchiata ($lines randuri)" && exit 1; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
