name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnxruntime numpy pillow 2>&1 | tail -1
          curl -fsSL -o rife.onnx https://huggingface.co/yuvraj108c/rife-onnx/resolve/main/rife49_ensemble_True_scale_1_sim.onnx; ls -la rife.onnx
          curl -fsSL https://raw.githubusercontent.com/hzwer/Practical-RIFE/main/LICENSE | head -3
          curl -fsSL https://raw.githubusercontent.com/yuvraj108c/ComfyUI-Rife-Tensorrt/master/LICENSE | head -3 || true
          curl -fsSL -o a.jpg http://images.cocodataset.org/val2017/000000000785.jpg
          python - <<'PY'
          import onnxruntime as ort, numpy as np, time
          from PIL import Image
          s=ort.InferenceSession('rife.onnx'); print([(i.name,i.shape,i.type) for i in s.get_inputs()],[(o.name,o.shape) for o in s.get_outputs()])
          im=Image.open('a.jpg').convert('RGB').resize((640,480))
          a=(np.asarray(im,np.float32)/255).transpose(2,0,1)[None]
          b=np.roll(a,8,axis=3)
          feeds={}
          for i in s.get_inputs():
              if 'img0' in i.name or i.name.endswith('0'): feeds[i.name]=a
              elif 'img1' in i.name or i.name.endswith('1'): feeds[i.name]=b
              else: feeds[i.name]=np.array([0.5],np.float32).reshape([d if isinstance(d,int) else 1 for d in i.shape]) if i.shape else np.array(0.5,np.float32)
          print({k:v.shape for k,v in feeds.items()})
          t=time.time(); o=s.run(None,feeds); print('ms',(time.time()-t)*1000,[x.shape for x in o], float(o[0].min()), float(o[0].max()))
          PY
