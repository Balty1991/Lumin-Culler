name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnx onnxruntime numpy pillow
          mkdir m && cd m
          for u in \
            https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx \
            https://huggingface.co/andraniksargsyan/migan/resolve/main/migan.onnx \
            https://huggingface.co/Sanster/MI-GAN/resolve/main/migan_pipeline_v2.onnx ; do
            f=$(basename $u); echo "== $u"; curl -fsSL -o "x_$f" "$u" && ls -la "x_$f" || echo FAIL
          done
          python - <<'PY'
          import glob, onnxruntime as ort, numpy as np
          for f in glob.glob('x_*'):
              try:
                  s = ort.InferenceSession(f)
                  print(f, [(i.name, i.shape, i.type) for i in s.get_inputs()], [(o.name, o.shape, o.type) for o in s.get_outputs()])
                  ins = s.get_inputs()
                  if len(ins) == 2 and 'uint8' in ins[0].type:
                      img = np.random.randint(0,255,(1,3,600,400),np.uint8); m = np.full((1,1,600,400),255,np.uint8); m[:,:,200:300,100:200]=0
                      o = s.run(None, {ins[0].name: img, ins[1].name: m})[0]; print('run ok', o.shape, o.dtype)
              except Exception as e: print(f, 'ERR', e)
          PY
