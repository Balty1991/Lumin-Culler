name: Probe aesthetic
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q onnxruntime numpy pillow scipy torch transformers --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 2>&1 | tail -1
          curl -fsSL -o vision.onnx https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx
          curl -fsSL -o aest.pth https://github.com/LAION-AI/aesthetic-predictor/raw/main/sa_0_4_vit_b_32_linear.pth
          mkdir img; cd img
          for i in 39769 139 285 632 724 776 785 802 872 885 1000 1268 1296 1353 1425 1490 1503 1532 1584 1675 1761 1818 1993 2006 2149 2153 2157 2261 2299 2431 2473 2532 2587 2592 2685 2923 3156 3255 3501 3553 3845 3934 4134 4395 4495 4765 5001 5037 5060 5193 6012 6040 6471 6723 6763 6771 6818 6894 6954 7088 7108 7278 7281 7386 7511 7574 7784 7795 7816 7818 7888 7977 8021 8211 8277 8532 8629 8690 8762 8844 8899 9378 9400 9448 9483 9590 9769 9772 9891 9914; do curl -fsSL -o "$(printf %012d $i).jpg" "http://images.cocodataset.org/val2017/$(printf %012d $i).jpg" || true; done
          cd ..
          python - <<'PY'
          import onnxruntime as ort, numpy as np, torch, json, base64, glob
          from PIL import Image, ImageFilter, ImageEnhance
          from scipy.stats import spearmanr
          d=json.load(open('src/core/clip/clipLabels.json'))
          Q=np.frombuffer(base64.b64decode(d['q']),np.float16).astype(np.float32).reshape(len(d['qkeys']),2,512)
          sd=torch.load('aest.pth',map_location='cpu'); w=sd['weight'].numpy()[0]; b=float(sd['bias'].numpy()[0])
          s=ort.InferenceSession('vision.onnx'); names=[o.name for o in s.get_outputs()]
          mean=np.array([0.48145466,0.4578275,0.40821073]); std=np.array([0.26862954,0.26130258,0.27577711])
          def prep(im):
              im=im.convert('RGB'); W,H=im.size; sc=224/min(W,H); im=im.resize((max(224,round(W*sc)),max(224,round(H*sc))),Image.BICUBIC)
              W,H=im.size; l=(W-224)//2; t=(H-224)//2; im=im.crop((l,t,l+224,t+224))
              return ((np.asarray(im,np.float32)/255-mean)/std).transpose(2,0,1)[None].astype(np.float32)
          def emb(im):
              o=s.run(None,{s.get_inputs()[0].name:prep(im)}); e=o[names.index('image_embeds')][0] if 'image_embeds' in names else o[0][0]
              return e/np.linalg.norm(e)
          from transformers import CLIPModel, CLIPProcessor
          m=CLIPModel.from_pretrained('openai/clip-vit-base-patch32').eval(); pp=CLIPProcessor.from_pretrained('openai/clip-vit-base-patch32')
          def enc(ds):
              t=pp(text=ds,return_tensors='pt',padding=True)
              with torch.no_grad(): e=m.text_projection(m.text_model(**t).pooler_output).numpy()
              e=e/np.linalg.norm(e,axis=1,keepdims=True); e=e.mean(0); return e/np.linalg.norm(e)
          EXTRA={'beauty':(['a beautiful photograph','a stunning photo with great composition','an aesthetically pleasing photo'],['a boring snapshot','a poorly composed, unappealing photo','a dull, uninteresting photo']),
                 'light':(['a photo with beautiful, soft light','a photo with golden warm light'],['a photo with flat, dull light','a photo with harsh, ugly lighting']),
                 'moment':(['a heartwarming moment captured in a photo','a joyful, lively moment'],['a dull, uneventful photo','a random photo of nothing special'])}
          X={k:np.stack([enc(v[0]),enc(v[1])]) for k,v in EXTRA.items()}
          def parts(e):
              p={}
              for j,k in enumerate(d['qkeys']): p[k]=1/(1+np.exp(-(float(e@Q[j,0])-float(e@Q[j,1]))*100))
              for k,v in X.items(): p[k]=1/(1+np.exp(-(float(e@v[0])-float(e@v[1]))*100))
              return p
          VARS={'v0':['sharp','exposure','quality','accident'],'v1':['sharp','exposure','quality','accident','beauty'],'v2':['sharp','exposure','quality','accident','beauty','light'],'v3':['sharp','exposure','beauty','light','moment'],'v4':['sharp','exposure','quality','accident','beauty','beauty','light','moment']}
          def score(e,ks): p=parts(e); return 3.5+4*sum(p[k] for k in ks)/len(ks)
          EMB=[]
          for f in sorted(glob.glob('img/*.jpg')):
              im=Image.open(f); EMB.append((emb(im),emb(im.filter(ImageFilter.GaussianBlur(5))),emb(ImageEnhance.Brightness(im).enhance(0.18))))
          from itertools import product
          def auc(a,b): return np.mean([1.0 if x>y else 0.5 if x==y else 0 for x,y in product(a,b)])
          O=np.array([e@w+b for e,_,_ in EMB])
          for name,ks in VARS.items():
              G=np.array([score(e,ks) for e,_,_ in EMB]); B=np.array([score(x,ks) for _,x,_ in EMB]); Dk=np.array([score(x,ks) for _,_,x in EMB])
              print(name,'spearman-vs-LAION %.3f'%spearmanr(O,G).correlation,'AUC blur %.3f dark %.3f'%(auc(G,B),auc(G,Dk)),'range %.2f-%.2f'%(G.min(),G.max()))
          Ob=np.array([x@w+b for _,x,_ in EMB]); Od=np.array([x@w+b for _,_,x in EMB]); print('LAION AUC blur %.3f dark %.3f'%(auc(O,Ob),auc(O,Od)))
          ALLQ=np.concatenate([Q,np.stack([X[k] for k in EXTRA])]).astype(np.float16)
          print('QKEYS',json.dumps(d['qkeys']+list(EXTRA)))
          js=base64.b64encode(ALLQ.tobytes()).decode(); print('QLEN',len(js))
          for i in range(0,len(js),3000): print('QCHUNK%03d %s'%(i//3000, js[i:i+3000]))
          PY
