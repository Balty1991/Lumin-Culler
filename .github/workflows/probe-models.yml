name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnx onnxruntime numpy pillow
          mkdir m && cd m
          curl -fsSL -o x_migan_pipeline_v2.onnx https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx
          python - <<'PY'
          import onnxruntime as ort, numpy as np
          s = ort.InferenceSession('x_migan_pipeline_v2.onnx')
          img = np.full((1,3,256,256),128,np.uint8); img[:,:,100:150,100:150]=255
          for name,m in [('255=hole', np.zeros((1,1,256,256),np.uint8)), ('0=hole', np.full((1,1,256,256),255,np.uint8))]:
              mm = m.copy(); mm[:,:,95:155,95:155] = 255 if name=='255=hole' else 0
              o = s.run(None, {'image': img, 'mask': mm})[0]
              print(name, 'center', o[0,:,125,125], 'outside', o[0,:,20,20])
          PY
