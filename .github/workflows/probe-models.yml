name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnxruntime numpy pillow 2>&1 | tail -1
          curl -fsSL "https://huggingface.co/api/models/Heliosoph/scunet-onnx/tree/main?recursive=1" | python3 -c "import sys,json; [print(' ',x['path'],x.get('size')) for x in json.load(sys.stdin) if x['type']=='file']"
          curl -fsSL https://huggingface.co/opencv/deblurring_nafnet/resolve/main/LICENSE | head -5
          curl -fsSL https://huggingface.co/opencv/deblurring_nafnet/resolve/main/nafnet.py
          curl -fsSL -o naf.onnx https://huggingface.co/opencv/deblurring_nafnet/resolve/main/deblurring_nafnet_2025may.onnx
          curl -fsSL -o t.jpg http://images.cocodataset.org/val2017/000000000785.jpg
          python - <<'PY'
          import onnxruntime as ort, numpy as np, time
          from PIL import Image, ImageFilter
          s=ort.InferenceSession('naf.onnx'); print('NAF',[(i.name,i.shape,i.type) for i in s.get_inputs()],[(o.name,o.shape) for o in s.get_outputs()])
          for side in (256,512):
              im=Image.open('t.jpg').convert('RGB').resize((side,side)).filter(ImageFilter.BoxBlur(2))
              x=(np.asarray(im,np.float32)/255).transpose(2,0,1)[None]
              t=time.time(); o=s.run(None,{s.get_inputs()[0].name:x}); print(side,'ms',(time.time()-t)*1000,o[0].shape,o[0].min(),o[0].max())
          PY
