name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in rife RIFE rife-onnx practical-rife frame-interpolation; do
          curl -fsSL "https://huggingface.co/api/models?search=$q&full=true&limit=100" | python3 -c "
          import sys,json
          for m in json.load(sys.stdin):
            fs=[s['rfilename'] for s in m.get('siblings',[]) if s['rfilename'].endswith('.onnx')]
            lic=[t for t in m.get('tags',[]) if t.startswith('license')]
            if fs: print(m['id'], lic, len(fs), fs[:3])
          "
          done | sort -u
          echo "== Practical-RIFE README links"
          curl -fsSL https://raw.githubusercontent.com/hzwer/Practical-RIFE/main/README.md | grep -io "https://drive.google.com[^) ]*\|4\.[0-9]*[^|]*drive[^|]*" | head -20
