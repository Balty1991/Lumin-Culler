name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnxruntime numpy pillow 2>&1 | tail -1
          R=https://huggingface.co/Xenova/slimsam-77-uniform/resolve/main
          curl -fsSL -o enc.onnx "$R/onnx/vision_encoder_quantized.onnx"; curl -fsSL -o dec.onnx "$R/onnx/prompt_encoder_mask_decoder_quantized.onnx"; curl -fsSL "$R/preprocessor_config.json"; echo
          D=https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main
          curl -fsSL -o depth.onnx "$D/onnx/model_quantized.onnx"; curl -fsSL "$D/preprocessor_config.json"; echo
          M=https://huggingface.co/Xenova/modnet/resolve/main
          curl -fsSL -o modnet.onnx "$M/onnx/model_quantized.onnx"; curl -fsSL "$M/preprocessor_config.json"; echo
          curl -fsSL -o bear.jpg http://images.cocodataset.org/val2017/000000000285.jpg
          curl -fsSL -o ppl.jpg http://images.cocodataset.org/val2017/000000000785.jpg
          python - <<'PY'
          import onnxruntime as ort, numpy as np, time
          from PIL import Image
          def io(s): return [(i.name,i.shape,i.type) for i in s.get_inputs()],[(o.name,o.shape) for o in s.get_outputs()]
          e=ort.InferenceSession('enc.onnx'); d=ort.InferenceSession('dec.onnx'); print('ENC',io(e)); print('DEC',io(d))
          im=Image.open('bear.jpg').convert('RGB'); W,H=im.size; sc=1024/max(W,H); nw,nh=round(W*sc),round(H*sc)
          a=np.asarray(im.resize((nw,nh),Image.BILINEAR),np.float32)/255
          a=(a-np.array([0.485,0.456,0.406]))/np.array([0.229,0.224,0.225]); pad=np.zeros((1024,1024,3),np.float32); pad[:nh,:nw]=a
          x=pad.transpose(2,0,1)[None].astype(np.float32); t=time.time(); eo=e.run(None,{e.get_inputs()[0].name:x}); print('enc ms',(time.time()-t)*1000,[o.shape for o in eo])
          feeds={}
          names=[o.name for o in e.get_outputs()]
          for i in d.get_inputs():
              if i.name in names: feeds[i.name]=eo[names.index(i.name)]
          feeds['input_points']=np.array([[[[W*0.5*sc,H*0.5*sc]]]],np.float32)
          feeds['input_labels']=np.array([[[1]]],np.int64)
          t=time.time(); do=d.run(None,feeds); print('dec ms',(time.time()-t)*1000,[(o.name,v.shape) for o,v in zip(d.get_outputs(),do)])
          iou=do[0]; m=do[1]; print('iou',iou); print('mask>0 frac per', [(m[0,0,k]>0).mean() for k in range(m.shape[2])])
          # depth
          s=ort.InferenceSession('depth.onnx'); print('DEPTH',io(s))
          im2=Image.open('ppl.jpg').convert('RGB').resize((518,518),Image.BICUBIC); b=(np.asarray(im2,np.float32)/255-np.array([0.485,0.456,0.406]))/np.array([0.229,0.224,0.225])
          t=time.time(); o=s.run(None,{s.get_inputs()[0].name:b.transpose(2,0,1)[None].astype(np.float32)}); print('depth ms',(time.time()-t)*1000,o[0].shape,o[0].min(),o[0].max())
          s=ort.InferenceSession('modnet.onnx'); print('MODNET',io(s))
          im3=Image.open('ppl.jpg').convert('RGB').resize((512,512)); c=(np.asarray(im3,np.float32)/255-0.5)/0.5
          t=time.time(); o=s.run(None,{s.get_inputs()[0].name:c.transpose(2,0,1)[None].astype(np.float32)}); print('modnet ms',(time.time()-t)*1000,o[0].shape,o[0].min(),o[0].max(),(o[0]>0.5).mean())
          PY
