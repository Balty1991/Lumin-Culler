name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q onnxruntime numpy pillow
          B=https://huggingface.co/Xenova/segformer-b0-finetuned-ade-512-512/resolve/main
          for f in onnx/model_quantized.onnx onnx/model.onnx config.json preprocessor_config.json; do curl -fsSL -o "$(basename $f)" "$B/$f" && ls -la "$(basename $f)"; done
          curl -fsSL -o t.jpg https://huggingface.co/datasets/hf-internal-testing/fixtures_ade20k/resolve/main/ADE_val_00000001.jpg || true
          grep -o '"2": "[a-z]*"\|"12": "[a-z]*"' config.json; cat preprocessor_config.json
          python - <<'PY'
          import onnxruntime as ort, numpy as np
          from PIL import Image
          for f in ['model_quantized.onnx','model.onnx']:
              s = ort.InferenceSession(f)
              print(f, [(i.name,i.shape,i.type) for i in s.get_inputs()], [(o.name,o.shape) for o in s.get_outputs()])
          im = Image.open('t.jpg').convert('RGB').resize((512,512))
          x = (np.asarray(im,np.float32)/255 - np.array([0.485,0.456,0.406]))/np.array([0.229,0.224,0.225])
          x = x.transpose(2,0,1)[None].astype(np.float32)
          s = ort.InferenceSession('model_quantized.onnx')
          import time; t=time.time(); o = s.run(None, {s.get_inputs()[0].name: x})[0]; print('ms', (time.time()-t)*1000, o.shape)
          lab = o[0].argmax(0)
          for y in range(0, lab.shape[0], 4):
              print(''.join('S' if v==2 else 'P' if v==12 else 'T' if v==4 else '.' for v in lab[y, ::2]))
          PY
