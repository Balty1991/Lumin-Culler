name: Probe web models
on:
  push:
    branches: [claude/fix-serii]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in sentence-transformers/clip-ViT-B-32-multilingual-v1 Xenova/clip-ViT-B-32-multilingual-v1 M-CLIP/XLM-Roberta-Large-Vit-B-32 Xenova/clip-vit-base-patch32 onnx-community/clip-ViT-B-32-multilingual-v1 Xenova/LaMa-ONNX Carve/LaMa-ONNX Xenova/slimsam-77-uniform onnx-community/depth-anything-v2-small Xenova/modnet onnx-community/BiRefNet_lite briaai/RMBG-2.0 Xenova/mobilesam onnx-community/Florence-2-base-ft HuggingFaceTB/SmolVLM-256M-Instruct onnx-community/sam2.1-hiera-tiny-ONNX; do
            echo "=== $r"; curl -fsSL "https://huggingface.co/api/models/$r/tree/main?recursive=1" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(' ',x['path'],x.get('size')) for x in d if x['type']=='file' and (x['path'].endswith(('.onnx','.onnx_data','.json','.txt')) ) and (x.get('size') or 0)<2e9]" 2>&1 | head -40 || echo "  N/A"
            curl -fsSL "https://huggingface.co/api/models/$r" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  license', [t for t in d.get('tags',[]) if t.startswith('license')])" 2>/dev/null || true
          done
