# Citește formatul modelelor pentru editorul pe telefon (gumă MI-GAN, lumină Zero-DCE,
# cer U²-Net): fișiere, mărimi, tensori de intrare/ieșire. Doar informativ.
name: Probe editor models
on:
  push:
    paths: ['.github/workflows/probe-models.yml', 'scripts/probe_models.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q ai-edge-litert onnx requests || pip install -q tflite-runtime onnx requests
      - run: python scripts/probe_models.py
