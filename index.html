<!doctype html>
<!-- `lang` ramane gol pana cand shell-ul de curatare afla limba reala
     (RescueApp: readRescueLocale, din limba salvata sau din navigator.languages).
     Scris "ro" din start, el AFIRMA romana inaintea oricarei verificari: pe un
     telefon setat pe engleza, asta inseamna un cititor de ecran care pronunta
     englezeste cu reguli romanesti, si un browser care ofera "tradu pagina"
     pentru o pagina care e deja in limba lui. Gol e onest: "inca nu stiu". -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="description" content="Free space, largest files first. On this phone. No account, no ads, no tracking." />
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <title>Lumin: AI Photo Cleaner</title>
    <!--
      CSP restrictiva: aplicatia e 100% auto-continuta (fara CDN-uri, fonturi sau
      analytics externe) — vezi public/privacy-policy.html. Directive:
        script-src 'wasm-unsafe-eval'  -> necesar pentru compilarea WASM (decodare
          RAW in core/rawDecoder.ts, backend-ul wasm al TensorFlow.js/Human), NU
          permite eval() de JS arbitrar (spre deosebire de 'unsafe-eval').
        worker-src 'self'              -> Web Workers module (analiza faciala,
          comparare hash-uri, decodare RAW) — toate incarcate din acelasi origin.
        img-src ... blob: data:        -> miniaturi/preview-uri (createObjectURL)
          si iconite/thumburi encodate ca data URI.
      Livrata ca meta tag (nu header HTTP) fiindca GitHub Pages/Capacitor local nu
      permit headere custom pe fisiere statice — 'frame-ancestors' e omis intentionat,
      browserele il ignora oricum intr-un meta tag (functioneaza doar ca header real).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <script src="%BASE_URL%theme-init.js"></script>
    <link rel="stylesheet" href="%BASE_URL%boot.css" />
  </head>
  <body>
    <!--
      Numele, desenat inainte de orice JavaScript.

      `#root` era gol, deci intre foaia de stil si prima randare React ecranul
      ramanea negru. Pe un telefon de gama medie golul ala se citeste ca
      "aplicatia nu porneste".

      Textul sta in #root ca sa dispara singur la primul commit al lui
      createRoot().render() — nu e nimic de curatat de mana. Stilul e
      public/boot.css (cateva reguli, incarcate inainte de bundle), nu foaia
      veche a ecranului de fotograf. Fara <style> inline: CSP-ul are
      style-src 'self', fara 'unsafe-inline'.
    -->
    <div id="root">
      <div class="boot-splash">Lumin</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
