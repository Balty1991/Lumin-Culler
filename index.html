<!doctype html>
<!-- `lang` ramane gol pana cand JS-ul afla limba reala (state/store.ts:applyLocale,
     din navigator.languages sau din alegerea salvata). Scris "ro" din start, el
     AFIRMA romana inaintea oricarei verificari: pe un telefon setat pe engleza,
     asta inseamna un cititor de ecran care pronunta englezeste cu reguli
     romanesti, si un browser care ofera "tradu pagina" pentru o pagina care e
     deja in limba lui. Gol e onest: "inca nu stiu". -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="description" content="Sortare foto cu AI, integral locala — pozele nu parasesc dispozitivul." />
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LuminCuller" />
    <title>Lumin Culler Pro — sortare foto AI</title>
    <!--
      CSP restrictiva: aplicatia e 100% auto-continuta (fara CDN-uri, fonturi sau
      analytics externe) — vezi public/privacy-policy.html. Directive:
        script-src 'wasm-unsafe-eval'  -> necesar pentru compilarea WASM (decodare
          RAW in core/rawDecoder.ts, backend-ul wasm al TensorFlow.js/Human), NU
          permite eval() de JS arbitrar (spre deosebire de 'unsafe-eval').
        worker-src 'self'              -> Web Workers module (analiza faciala,
          comparare hash-uri, decodare RAW) — toate incarcate din acelasi origin.
        img-src ... blob: data:        -> miniaturi/preview-uri (createObjectURL)
          si iconite/thumburi encodate ca data URI.
      Livrata ca meta tag (nu header HTTP) fiindca GitHub Pages/Capacitor local nu
      permit headere custom pe fisiere statice — 'frame-ancestors' e omis intentionat,
      browserele il ignora oricum intr-un meta tag (functioneaza doar ca header real).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!--
      MARCA, desenata inainte de orice JavaScript.

      `#root` era gol, deci intre momentul in care ajunge foaia de stil si
      momentul in care React face prima randare ecranul ramanea complet negru.
      Pe telefoanele pe care chiar conteaza (gama medie, unde parsarea
      bundle-ului principal nu e instantanee) golul acela e citit ca "aplicatia
      nu porneste", si e prima impresie despre produs.

      Marcajul de mai jos NU e o copie a ecranului de start: foloseste exact
      clasele lui (.empty-badge / .empty-badge-mark, vezi styles.concept.css),
      deci nu poate arata altfel decat medalionul real si nu adauga aproape
      niciun octet de CSS. Se vede din clipa in care foaia de stil e gata —
      adica inainte de bundle, nu dupa el.

      De ce marcaj static si nu o componenta: o componenta ar avea nevoie tocmai
      de JS-ul asteptat. Si de ce nu un <style> inline: CSP-ul de mai sus are
      `style-src 'self'`, fara 'unsafe-inline', si nu merita slabit pentru asta.

      Dispare singur: `createRoot(...).render()` goleste containerul la primul
      commit — nu e nimic de curatat de mana, si nu poate ramane blocat pe ecran
      daca randarea intarzie.
    -->
    <div id="root">
      <div class="boot-splash">
        <div class="empty-badge" aria-hidden="true"><span class="empty-badge-mark">LC</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
