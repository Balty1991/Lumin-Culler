<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<!-- Pictograma Cherrypic. Pânza 108×108 = pânza unei pictograme adaptive Android;
     tot ce e în prim-plan stă în cercul sigur de 66 (centrat la 54,54). -->
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0d24"/>
      <stop offset=".55" stop-color="#1a0814"/>
      <stop offset="1" stop-color="#0c0410"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".45">
      <stop offset="0" stop-color="#ff2f6d" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff2f6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cherry" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ff7d97"/>
      <stop offset=".38" stop-color="#f02a57"/>
      <stop offset=".8" stop-color="#b3123d"/>
      <stop offset="1" stop-color="#7d0c2c"/>
    </radialGradient>
    <radialGradient id="cherry2" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ff6f8c"/>
      <stop offset=".38" stop-color="#e2214d"/>
      <stop offset=".8" stop-color="#a10f37"/>
      <stop offset="1" stop-color="#6c0a26"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f9e5b"/>
      <stop offset="1" stop-color="#6fdc8c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25a35a"/>
      <stop offset="1" stop-color="#8ef0a6"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1e3"/>
      <stop offset=".5" stop-color="#d7a6ff"/>
      <stop offset="1" stop-color="#8fdcff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <g id="bgLayer">
    <rect width="108" height="108" fill="url(#bg)"/>
    <circle cx="54" cy="62" r="40" fill="url(#glow)"/>
  </g>

  <g id="fgLayer">
    <!-- Vizorul: alegerea unei poze. -->
    <g fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33.5 40.5 V36.5 a3 3 0 0 1 3 -3 H40.5"/>
      <path d="M67.5 33.5 H71.5 a3 3 0 0 1 3 3 V40.5"/>
      <path d="M74.5 67.5 V71.5 a3 3 0 0 1 -3 3 H67.5"/>
      <path d="M40.5 74.5 H36.5 a3 3 0 0 1 -3 -3 V67.5"/>
    </g>
    <!-- Cozile și frunza. -->
    <g filter="url(#sh)">
      <path d="M46.2 57.5 C48 50 52 44 58.2 38.6" fill="none" stroke="url(#stem)" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M61.8 60 C61.6 52 60.6 45 58.2 38.6" fill="none" stroke="url(#stem)" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M58.2 38.6 C61 34.2 67.4 33 71.4 35.4 C68.6 39.6 62.4 40.6 58.2 38.6 Z" fill="url(#leaf)"/>
      <path d="M59.6 38.4 C63 37.6 66.4 36.6 69.6 35.6" fill="none" stroke="#1f7a43" stroke-opacity=".55" stroke-width=".6" stroke-linecap="round"/>
      <!-- Cireșele. -->
      <circle cx="61.6" cy="64.4" r="9.4" fill="url(#cherry2)"/>
      <circle cx="46" cy="62" r="9.8" fill="url(#cherry)"/>
    </g>
    <ellipse cx="42.6" cy="58" rx="3.1" ry="2" fill="#fff" fill-opacity=".55" transform="rotate(-32 42.6 58)"/>
    <ellipse cx="58.4" cy="60.6" rx="2.6" ry="1.7" fill="#fff" fill-opacity=".45" transform="rotate(-32 58.4 60.6)"/>
    <!-- Scânteia AI-ului. -->
    <path d="M71 44.5 C71.5 47.6 72.4 48.5 75.5 49 C72.4 49.5 71.5 50.4 71 53.5 C70.5 50.4 69.6 49.5 66.5 49 C69.6 48.5 70.5 47.6 71 44.5 Z" fill="url(#ai)"/>
  </g>
</svg>
<script>
  const mode = new URLSearchParams(location.search).get('m') || 'full';
  if (mode === 'full') document.getElementById('s').setAttribute('viewBox', '18 18 72 72');
  if (mode === 'mask') { document.getElementById('s').setAttribute('viewBox', '11 11 86 86'); }
  if (mode === 'fg') document.getElementById('bgLayer').remove();
  if (mode === 'bg') document.getElementById('fgLayer').remove();
</script>
</body></html>
