# Serverul intermediar pentru efectele AI Lumin. Vezi server/README.md.
name = "lumin-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Plafonul total pe zi, în dolari, pentru toți utilizatorii la un loc.
DAILY_BUDGET_USD = "5"
# Modelele fal.ai; se pot schimba fără cod nou în aplicație.
ALIVE_MODEL = "fal-ai/kling-video/v2.1/standard/image-to-video"
STYLE_MODEL = "fal-ai/flux-pro/kontext"
# Primul furnizor care răspunde. gemini e sărit dacă nu există secretul GEMINI_API_KEY.
# Secretele NU se pun aici: `npx wrangler secret put GEMINI_API_KEY`
# Gemini întâi (plătit la consum, ieftin, fără plafonul de 10.000 neuroni/zi al contului gratuit).
AI_PROVIDERS = "gemini,workers"
GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
# Editări generative (retuș AI, cer nou, gumă) pe lună, pe instalare; și plafonul zilnic pe server.
AIEDIT_MONTHLY = "60"
AIEDIT_DAILY_TOTAL = "400"
GEMINI_MODEL = "gemini-2.5-flash"

# Workers AI: stilurile gratuite, când nu e pusă o cheie fal.ai.
[ai]
binding = "AI"

# Creat cu: npx wrangler kv namespace create LIMITS  (apoi pui id-ul aici;
# workflow-ul deploy-ai-server.yml îl creează și îl completează singur)
[[kv_namespaces]]
binding = "LIMITS"
id = "PUNE_AICI_ID_UL_KV"
