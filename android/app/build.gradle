apply plugin: 'com.android.application'
// Analiza AI nativa (Faza 1) — primul cod Kotlin din acest proiect, vezi
// plugins/FaceDetectionPlugin.kt.
apply plugin: 'org.jetbrains.kotlin.android'

// Semnare de productie (Play Store cere APK/AAB semnat cu o cheie de eliberare
// stabila — aceeasi cheie la fiecare actualizare, altfel Play Console refuza
// upload-ul). Citeste din keystore.properties (NECOMIS in git, vezi .gitignore
// si keystore.properties.example din acest folder) — fara acel fisier, build-ul
// de release ramane nesemnat (exact comportamentul dinainte de aceasta configurare),
// ca sa nu stricam fluxul curent de dezvoltare/CI care nu are nevoie de semnare.
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.luminculler.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.luminculler.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Tinute in pas cu package.json (2.0.0). versionName e ce vede
        // utilizatorul in Play Store si in Setari > Aplicatii; ramasese "1.0"
        // pentru o aplicatie deja la v2, ceea ce ar fi aparut ca atare in
        // magazin. versionCode trebuie DOAR sa creasca la fiecare incarcare in
        // Play — nu are legatura cu versiunea afisata, si Play refuza un
        // versionCode deja folosit.
        //
        // ATENTIE: valorile de aici conteaza DOAR pentru build-urile locale
        // (Android Studio). Pachetul care ajunge in Play e construit de
        // .github/workflows/release-android.yml, care le SUPRASCRIE amandoua
        // cu sed inainte de `gradlew bundleRelease`: versionCode devine
        // numarul rularii workflow-ului (GITHUB_RUN_NUMBER), iar versionName
        // devine tag-ul (fara "v") sau "0.0.0-dev.<numar>" la o rulare
        // manuala. De aceea versiunile din Play Console sunt de forma
        // "14 (0.0.0-dev.14)" si nu au nicio legatura cu ce scrie aici — a
        // urca numarul de mai jos NU pregateste si nu deblocheaza nimic acolo.
        versionCode 3
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Optimizarea codului (DEX) e unul dintre cele trei praguri de
            // calitate anuntate de Google Play pentru februarie 2027; pana
            // acum era oprita, adica exact ce Play raporteaza drept "limited
            // DEX optimization". Regulile de pastrare din proguard-rules.pro
            // sunt obligatorii — Capacitor isi gaseste plugin-urile prin
            // reflexie, iar R8 le-ar sterge ca pe cod mort.
            minifyEnabled true
            shrinkResources true
            // `proguard-android.txt`, NU varianta `-optimize`.
            //
            // Aplicatia se inchidea fortat la pornire, instalata din Play, desi
            // acelasi cod cu R8 pornit mergea perfect ca APK de test. Diferenta:
            // build-ul de test e `debuggable`, si acolo R8 SARE peste pasii de
            // optimizare (inline, contopire de clase, transformari pe
            // singleton-urile Kotlin). In release ii face pe toti — si unul
            // dintre ei rupea pornirea.
            //
            // Varianta neoptimizanta pastreaza MICSORAREA si OFUSCAREA, adica
            // fix ce se numara la pragul Play de 25%, si scoate exact clasa de
            // transformari care difera intre ce am testat si ce am livrat. Din
            // acest moment cele doua build-uri chiar sunt identice, deci un test
            // trecut inseamna ceva.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        // APK-ul de test se construieste cu assembleDebug, care NU trece prin
        // R8 — deci pornirea lui pe release ar fi ajuns nevalidata direct in
        // magazin, si tocmai in release se vad rupturile de reflexie.
        //
        // Cu `-PminifyDebug=true`, build-ul de debug foloseste ACELEASI reguli
        // ca release-ul, dar ramane semnat cu cheia de debug, deci se poate
        // instala si incerca pe telefon. Implicit ramane oprit: un debug
        // minificat se construieste vizibil mai incet si are urme de stiva mai
        // greu de citit.
        debug {
            def minificaDebug = project.hasProperty('minifyDebug') && project.property('minifyDebug') == 'true'
            minifyEnabled minificaDebug
            // shrinkResources ODATA cu minifyEnabled, ca testul sa acopere EXACT
            // ce face release-ul. Fara el, APK-ul de proba trecea prin R8 dar nu
            // si prin curatarea de resurse — iar aceea poate scoate o resursa
            // ceruta dinamic (prin nume), care s-ar fi vazut abia in AAB-ul din
            // magazin. Un test care nu acopera aceeasi cale nu e o validare.
            shrinkResources minificaDebug
            // Acelasi fisier ca release-ul, ca testul sa insemne ceva.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // trebuie sa coincida cu sourceCompatibility/targetCompatibility (Java 21) din
    // capacitor.build.gradle (auto-generat) — un target JVM diferit intre Java si
    // Kotlin in acelasi modul e o eroare de build.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Analiza AI nativa (Faza 1) — vezi plugins/FaceDetectionPlugin.kt. Modelul ML Kit
    // e "bundled" (impachetat direct in APK la build) — functioneaza offline imediat
    // dupa instalare, fara descarcare separata prin Play Services.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "com.google.mlkit:face-detection:$mlkitFaceDetectionVersion"
    // Analiza AI nativa (Faza 3, rescrisa) — vezi plugins/ImageLabelingPlugin.kt.
    // Modelul e bundle-uit direct in aceasta dependinta (ca ML Kit face-detection
    // de mai sus), nu mai vine dintr-un asset descarcat separat de CI.
    implementation "com.google.mlkit:image-labeling:$mlkitImageLabelingVersion"
    // Analiza AI nativa (Faza 4) — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt.
    // Modelele (.task / .tflite) sunt descarcate de CI in assets/, nu vin din
    // aceasta dependinta — biblioteca de aici e doar API-ul MediaPipe Tasks.
    implementation "com.google.mediapipe:tasks-vision:$mediapipeTasksVisionVersion"
    // Analiza AI nativa (Faza 5) — vezi plugins/TextRecognitionPlugin.kt. Modelul
    // e bundle-uit direct in aceasta dependinta (ca ML Kit face-detection mai sus),
    // nu vine din assets/ descarcate de CI.
    implementation "com.google.mlkit:text-recognition:$mlkitTextRecognitionVersion"
    implementation "com.google.mlkit:genai-image-description:$mlkitGenAiImageDescriptionVersion"
    // Abonament Premium — vezi plugins/BillingPlugin.kt. Singura dependinta din
    // proiect care chiar are nevoie de retea: verificarea abonamentului se face
    // prin Google Play, restul aplicatiei ramane complet offline.
    implementation "com.android.billingclient:billing-ktx:$billingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
