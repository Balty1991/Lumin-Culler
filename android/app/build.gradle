apply plugin: 'com.android.application'
// Analiza AI nativa (Faza 1) — primul cod Kotlin din acest proiect, vezi
// plugins/FaceDetectionPlugin.kt.
apply plugin: 'org.jetbrains.kotlin.android'

// Semnare de productie (Play Store cere APK/AAB semnat cu o cheie de eliberare
// stabila — aceeasi cheie la fiecare actualizare, altfel Play Console refuza
// upload-ul). Citeste din keystore.properties (NECOMIS in git, vezi .gitignore
// si keystore.properties.example din acest folder) — fara acel fisier, build-ul
// de release ramane nesemnat (exact comportamentul dinainte de aceasta configurare),
// ca sa nu stricam fluxul curent de dezvoltare/CI care nu are nevoie de semnare.
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.luminculler.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.luminculler.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Tinute in pas cu package.json (2.0.0). versionName e ce vede
        // utilizatorul in Play Store si in Setari > Aplicatii; ramasese "1.0"
        // pentru o aplicatie deja la v2, ceea ce ar fi aparut ca atare in
        // magazin. versionCode trebuie DOAR sa creasca la fiecare incarcare in
        // Play — nu are legatura cu versiunea afisata, si Play refuza un
        // versionCode deja folosit.
        //
        // 3, nu 2: 2 a fost pregatit pentru incarcarea care a dus in Play
        // versiunea cu Billing 9. Avertismentul de politica din Play Console
        // ("Aplicatia trebuie sa foloseasca Biblioteca Google Play Billing
        // 8.0.0 sau ulterioara") NU se stinge la incarcarea unui pachet, ci
        // dupa ce o versiune noua e PUBLICATA pe toate canalele pe care se
        // publica activ (inclusiv testele interne/inchise ramase cu un build
        // vechi) si dupa ce Play rescaneaza — deci mai e nevoie de cel putin o
        // incarcare, iar aceea are nevoie de un numar liber.
        versionCode 3
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    // trebuie sa coincida cu sourceCompatibility/targetCompatibility (Java 21) din
    // capacitor.build.gradle (auto-generat) — un target JVM diferit intre Java si
    // Kotlin in acelasi modul e o eroare de build.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Analiza AI nativa (Faza 1) — vezi plugins/FaceDetectionPlugin.kt. Modelul ML Kit
    // e "bundled" (impachetat direct in APK la build) — functioneaza offline imediat
    // dupa instalare, fara descarcare separata prin Play Services.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "com.google.mlkit:face-detection:$mlkitFaceDetectionVersion"
    // Analiza AI nativa (Faza 3, rescrisa) — vezi plugins/ImageLabelingPlugin.kt.
    // Modelul e bundle-uit direct in aceasta dependinta (ca ML Kit face-detection
    // de mai sus), nu mai vine dintr-un asset descarcat separat de CI.
    implementation "com.google.mlkit:image-labeling:$mlkitImageLabelingVersion"
    // Analiza AI nativa (Faza 4) — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt.
    // Modelele (.task / .tflite) sunt descarcate de CI in assets/, nu vin din
    // aceasta dependinta — biblioteca de aici e doar API-ul MediaPipe Tasks.
    implementation "com.google.mediapipe:tasks-vision:$mediapipeTasksVisionVersion"
    // Analiza AI nativa (Faza 5) — vezi plugins/TextRecognitionPlugin.kt. Modelul
    // e bundle-uit direct in aceasta dependinta (ca ML Kit face-detection mai sus),
    // nu vine din assets/ descarcate de CI.
    implementation "com.google.mlkit:text-recognition:$mlkitTextRecognitionVersion"
    // Abonament Premium — vezi plugins/BillingPlugin.kt. Singura dependinta din
    // proiect care chiar are nevoie de retea: verificarea abonamentului se face
    // prin Google Play, restul aplicatiei ramane complet offline.
    implementation "com.android.billingclient:billing-ktx:$billingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
