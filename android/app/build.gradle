apply plugin: 'com.android.application'
// Analiza AI nativa (Faza 1) — primul cod Kotlin din acest proiect, vezi
// plugins/FaceDetectionPlugin.kt.
apply plugin: 'org.jetbrains.kotlin.android'

// Semnare de productie (Play Store cere APK/AAB semnat cu o cheie de eliberare
// stabila — aceeasi cheie la fiecare actualizare, altfel Play Console refuza
// upload-ul). Citeste din keystore.properties (NECOMIS in git, vezi .gitignore
// si keystore.properties.example din acest folder) — fara acel fisier, build-ul
// de release ramane nesemnat (exact comportamentul dinainte de aceasta configurare),
// ca sa nu stricam fluxul curent de dezvoltare/CI care nu are nevoie de semnare.
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.luminculler.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.luminculler.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    // trebuie sa coincida cu sourceCompatibility/targetCompatibility (Java 21) din
    // capacitor.build.gradle (auto-generat) — un target JVM diferit intre Java si
    // Kotlin in acelasi modul e o eroare de build.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Analiza AI nativa (Faza 1) — vezi plugins/FaceDetectionPlugin.kt. Modelul ML Kit
    // e "bundled" (impachetat direct in APK la build) — functioneaza offline imediat
    // dupa instalare, fara descarcare separata prin Play Services.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "com.google.mlkit:face-detection:$mlkitFaceDetectionVersion"
    // Analiza AI nativa (Faza 3) — vezi plugins/ObjectDetectionPlugin.kt. Modelul
    // TFLite (detect.tflite) e descarcat de CI in assets/, nu vine din aceasta
    // dependinta — biblioteca de aici e doar runtime-ul de inferenta.
    implementation "org.tensorflow:tensorflow-lite:$tensorflowLiteVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
