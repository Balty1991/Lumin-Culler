ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Analiza AI nativa (Faza 1 — vezi plugins/FaceDetectionPlugin.kt): primul cod Kotlin
    // din acest proiect, model ML Kit bundle-uit direct in APK (offline imediat, fara
    // descarcare separata prin Play Services) — coerent cu "AI local" din tagline-ul aplicatiei.
    kotlinVersion = '2.4.10'
    mlkitFaceDetectionVersion = '16.1.7'
    // Analiza AI nativa (Faza 3 — vezi plugins/ObjectDetectionPlugin.kt): ML Kit
    // nu ofera detectie de obiecte la nivel COCO-80 (doar 5 categorii foarte
    // largi), asa ca aceasta piesa ruleaza direct un model TFLite (vezi
    // "Bundle native object-detection model" din workflow-urile CI).
    tensorflowLiteVersion = '2.17.0'
    // Analiza AI nativa (Faza 4 — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt):
    // versiune verificata direct din repo-ul oficial de exemple Google
    // (google-ai-edge/mediapipe-samples, build.gradle) — maven.google.com nu
    // e accesibil din acest sandbox ca sa se verifice altfel.
    mediapipeTasksVisionVersion = '0.10.29'
    // Analiza AI nativa (Faza 5 — vezi plugins/TextRecognitionPlugin.kt): OCR
    // bundle-uit direct in APK (ca ML Kit face-detection, Faza 1), NU prin
    // Play Services — versiune verificata din googlesamples/mlkit (build.gradle).
    mlkitTextRecognitionVersion = '16.0.1'
}