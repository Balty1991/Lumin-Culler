ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Analiza AI nativa (Faza 1 — vezi plugins/FaceDetectionPlugin.kt): primul cod Kotlin
    // din acest proiect, model ML Kit bundle-uit direct in APK (offline imediat, fara
    // descarcare separata prin Play Services) — coerent cu "AI local" din tagline-ul aplicatiei.
    kotlinVersion = '2.4.10'
    mlkitFaceDetectionVersion = '16.1.7'
    // Analiza AI nativa (Faza 3, rescrisa — vezi plugins/ImageLabelingPlugin.kt):
    // inlocuieste vechiul model TFLite coco_ssd_mobilenet_v1 (2018, vocabular
    // FIX de 80 clase, fara nicio clasa de rezerva — cauza confirmata a 3
    // etichete gresite pe device real, vezi istoricul git al plugin-ului) cu ML
    // Kit Image Labeling, bundle-uit direct in APK (ca face-detection/text-
    // recognition de mai jos) — peste 400 de etichete generice (taxonomie Open
    // Images), fara nicio descarcare CI separata de model.
    mlkitImageLabelingVersion = '17.0.9'
    // Analiza AI nativa (Faza 4 — vezi plugins/FaceMeshPlugin.kt / ImageClassifierPlugin.kt):
    // versiune verificata direct din repo-ul oficial de exemple Google
    // (google-ai-edge/mediapipe-samples, build.gradle) — maven.google.com nu
    // e accesibil din acest sandbox ca sa se verifice altfel.
    mediapipeTasksVisionVersion = '0.10.29'
    // Analiza AI nativa (Faza 5 — vezi plugins/TextRecognitionPlugin.kt): OCR
    // bundle-uit direct in APK (ca ML Kit face-detection, Faza 1), NU prin
    // Play Services — versiune verificata din googlesamples/mlkit (build.gradle).
    mlkitTextRecognitionVersion = '16.0.1'
    // ML Kit GenAI (Gemini Nano prin AICore). Inca in beta la data adaugarii, si
    // singura dependinta din proiect care nu e stabila — de aceea tot ce e in
    // jurul ei e scris ca "poate lipsi", nu ca "va fi acolo". Vezi
    // plugins/ImageDescriptionPlugin.kt.
    mlkitGenAiImageDescriptionVersion = '1.0.0-beta1'
    // Abonament Premium (vezi plugins/BillingPlugin.kt). Google Play Billing
    // Library, folosita direct — acelasi tipar ca restul plugin-urilor din
    // proiect, scrise de mana in loc sa se adauge un wrapper Cordova/Capacitor
    // tert peste ea.
    //
    // v9, nu v7: Play Console a semnalat ca de la 31 august 2026 orice
    // actualizare trimisa cu o versiune sub 8.0.0 e RESPINSA. Am sarit direct
    // la 9 (recomandarea Google) ca sa nu refacem migrarea peste cateva luni —
    // v8 si v9 au impreuna doua schimbari care rup compilarea, si le-am facut
    // pe amandoua o data (vezi BillingPlugin.kt).
    //
    // v9 cere androidx.core 1.9+ pentru codul de eroare al Play Store-ului
    // blocat; proiectul e deja pe 1.17.0 (androidxCoreVersion, mai sus).
    billingVersion = '9.0.0'
}